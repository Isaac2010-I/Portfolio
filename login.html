<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="main">
      <div class="picture">
        <div class="Welcome">Welcome Page</div>
        <div class="website">WWW.YOURSITE.COM</div>
      </div>
      <div class="page">
        <div class="hello">Hello!</div>
        <div class="good">Good Morning</div>
        <div class="login">Login Your Account</div>
        <div class="information">
          <form action="">
            <input type="email" placeholder="Email Address" class="email" />
            <br />
            <input type="password" placeholder="Password" class="password" />
            <input id="checkbox" type="checkbox" class="checkbox" />
            <label for="checkbox" class="check">Remember Me</label>
            <label for="" class="forgot">Forgot Password?</label>
            
            <button>SUBMIT</button>
            
          </form>
        </div>
        <div class="create">Create Account</div>
      </div>
    </div>
  </body>
</html>
