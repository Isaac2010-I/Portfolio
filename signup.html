
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Signup</title>

    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <main class="main">

        <!-- Left Image Panel -->
        <section class="picture">
            <div class="picture-content">
                <h1 class="Welcome">Welcome Page</h1>
                <p class="website">Your journey starts here.</p>
            </div>
        </section>

        <!-- Signup Form Panel -->
        <section class="page">

            <header class="page-header">
                <h2 class="hello">Hello!</h2>
                <p class="good">Good Morning</p>
                <h3 class="login">Create Your Account</h3>
            </header>

            <div class="information">

                <form action="#" method="post">

                    <!-- Username -->
                    <div class="form-group">
                        <label for="username" class="visually-hidden">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter Username"
                            class="name"
                            autocomplete="username"
                            minlength="3"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="visually-hidden">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email Address"
                            class="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="visually-hidden">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create Password"
                            class="password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <!-- Submit Button -->
                    <button type="submit">CREATE ACCOUNT</button>

                    <!-- Login Link -->
                    <div class="account-link">
                        <p class="para">Already have an account?</p>
                        <a href="login.html" class="create">Login</a>
                    </div>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
